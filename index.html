<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konnect ♥</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💫</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<style>
  :root{
    --bg:#05050e;
    --card:rgba(255,255,255,.05);
    --line:rgba(255,255,255,.12);
    --txt:#eef0ff;
    --mut:#9aa1c3;
    --pink:#ff5f9e;
    --vio:#8b7bff;
    --cyan:#63c8ff;
    --grad:linear-gradient(135deg,var(--pink),var(--vio));
    --radius:26px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Outfit',sans-serif;background:var(--bg);color:var(--txt);
    min-height:100vh;display:grid;place-items:center;padding:20px;overflow-x:hidden;
  }
  /* ---------- space ---------- */
  #space{position:fixed;inset:0;z-index:0;pointer-events:none}
  .neb{position:fixed;border-radius:50%;filter:blur(90px);z-index:0;pointer-events:none;opacity:.4}
  .neb-1{width:58vw;height:58vw;left:-14vw;top:-16vw;background:radial-gradient(circle,rgba(139,123,255,.5),transparent 65%);animation:drift 26s ease-in-out infinite}
  .neb-2{width:54vw;height:54vw;right:-16vw;bottom:-18vw;background:radial-gradient(circle,rgba(255,95,158,.38),transparent 65%);animation:drift 32s ease-in-out infinite reverse}
  .neb-3{width:30vw;height:30vw;left:42vw;top:40vh;background:radial-gradient(circle,rgba(99,200,255,.2),transparent 70%);animation:drift 44s ease-in-out infinite}
  @keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(3vw,2.5vh) scale(1.06)}}
  /* ---------- planets ---------- */
  .planet{position:fixed;border-radius:50%;pointer-events:none;z-index:1}
  .planet-a{
    width:clamp(70px,11vw,124px);height:clamp(70px,11vw,124px);
    left:clamp(10px,3.6vw,66px);bottom:clamp(12px,5vh,52px);
    background:
      radial-gradient(circle at 31% 26%,rgba(255,255,255,.6),rgba(255,255,255,0) 26%),
      radial-gradient(circle at 33% 30%,#ffc9dd 0%,#ff7ab0 26%,#e0286e 52%,#77103a 78%,#2b0617 100%);
    box-shadow:inset -16px -14px 34px rgba(0,0,0,.5),inset 6px 6px 18px rgba(255,255,255,.12),
               0 0 44px rgba(255,110,170,.18),0 0 90px rgba(139,123,255,.1);
    animation:floatP 11s ease-in-out infinite;
  }
  .planet-b{
    width:clamp(86px,13vw,150px);height:clamp(86px,13vw,150px);
    right:clamp(12px,4vw,74px);top:clamp(12px,6vh,56px);
    background:
      radial-gradient(circle at 30% 25%,rgba(255,255,255,.55),rgba(255,255,255,0) 24%),
      radial-gradient(circle at 34% 30%,#cfe6ff 0%,#6cb5ff 24%,#2f66ff 50%,#15276e 78%,#060b2c 100%);
    box-shadow:inset -18px -16px 36px rgba(0,0,0,.55),inset 6px 6px 20px rgba(255,255,255,.14),
               0 0 48px rgba(120,170,255,.2),0 0 100px rgba(139,123,255,.12);
    animation:floatP 15s ease-in-out infinite reverse;
  }
  @keyframes floatP{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
  .sending .planet{animation-play-state:paused;z-index:26;filter:brightness(1.1) saturate(1.05)}
  /* ---------- card ---------- */
  .card{
    position:relative;z-index:2;width:min(430px,94vw);max-height:92vh;overflow:auto;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:30px 28px 26px;
    box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    scrollbar-width:thin;transition:opacity .45s ease,transform .45s ease;
  }
  .card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
    background:linear-gradient(160deg,rgba(255,255,255,.28),transparent 30%,transparent 70%,rgba(255,95,158,.35));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
  .card.gone{opacity:0;transform:translateY(-6px) scale(.985);pointer-events:none}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
  .brand{font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt)}
  .brand i{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hello{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;
    font-size:clamp(44px,11vw,54px);line-height:1;color:#fff;text-shadow:0 0 40px rgba(255,95,158,.4)}
  .hello .heart{display:inline-block;color:var(--pink);animation:beat 1.6s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(255,95,158,.9))}
  @keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.18)}24%{transform:scale(1)}36%{transform:scale(1.12)}}
  .prompt{margin-top:14px;color:var(--txt);font-size:17px;font-weight:500;line-height:1.45}
  .prompt b{color:#fff}
  .hint{margin-top:6px;color:var(--mut);font-size:13.5px;line-height:1.5}
  .fieldset{border:0;margin-top:22px}
  .legend-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .option{
    position:relative;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;
    padding:13px 16px;margin-bottom:11px;border-radius:16px;cursor:pointer;
    border:1px solid var(--line);background:rgba(255,255,255,.035);
    transition:border-color .2s,background .2s,transform .2s,box-shadow .2s;
  }
  .option:hover{background:rgba(255,255,255,.06)}
  .option:has(input:focus-visible){outline:2px solid var(--pink);outline-offset:2px}
  .option input{position:absolute;opacity:0;pointer-events:none}
  .opt-icon{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;
    background:linear-gradient(150deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.14)}
  .opt-icon svg{width:21px;height:21px}
  .opt-copy b{display:block;font-size:15.5px;font-weight:600}
  .opt-copy small{color:var(--mut);font-size:12.5px}
  .opt-check{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(255,255,255,.25);
    display:grid;place-items:center;transition:.25s;color:transparent;font-size:12px}
  .option:has(input:checked){border-color:transparent;background:linear-gradient(#141226,#141226) padding-box,var(--grad) border-box;
    box-shadow:0 10px 30px -8px rgba(255,95,158,.45)}
  .option:has(input:checked) .opt-check{background:var(--grad);border-color:transparent;color:#fff}
  .option:has(input:checked) .opt-copy b{color:#fff}
  .detail{display:grid;gap:8px;margin-top:14px;overflow:hidden;max-height:0;opacity:0;transform:translateY(-6px);transition:max-height .35s ease,opacity .3s ease,transform .35s ease}
  .detail.show{max-height:140px;opacity:1;transform:none}
  .detail label{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600}
  .input-wrap{position:relative;display:flex;align-items:center}
  .input-wrap .lead{position:absolute;left:16px;color:var(--pink);font-weight:600;font-size:16px;pointer-events:none}
  .input-wrap input{
    width:100%;padding:14px 16px 14px 16px;font:inherit;font-size:16px;color:#fff;border-radius:14px;
    border:1px solid var(--line);background:rgba(0,0,0,.3);outline:none;transition:border-color .2s,box-shadow .2s;
  }
  .input-wrap input:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(255,95,158,.16)}
  .input-wrap input::placeholder{color:#5d6280}
  .err{color:#ff86a8;font-size:12.5px;min-height:0;display:none;align-items:center;gap:6px}
  .err.show{display:flex;animation:rise .25s ease}
  @keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .shake{animation:shake .4s ease}
  @keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
  .cta{
    width:100%;margin-top:18px;border:0;cursor:pointer;font:inherit;font-size:16.5px;font-weight:600;color:#fff;
    padding:15px;border-radius:999px;background:var(--grad);display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 14px 34px -8px rgba(255,95,158,.55);transition:transform .2s,box-shadow .2s,filter .2s;
  }
  .cta:hover{transform:translateY(-2px);box-shadow:0 18px 40px -8px rgba(255,95,158,.7)}
  .cta:active{transform:scale(.98)}
  .cta:disabled{opacity:.75;cursor:default;transform:none}
  .spinner{display:none;width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}
  .cta.loading .spinner{display:inline-block}
  .cta.loading .cta-txt-ok{display:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .foot{margin-top:18px;text-align:center;color:#5f6483;font-size:12px}
  /* reveal on load */
  .rv{opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.3,1)}
  .ready .rv{opacity:1;transform:none}
  .d1{transition-delay:.05s}.d2{transition-delay:.16s}.d3{transition-delay:.3s}.d4{transition-delay:.42s}.d5{transition-delay:.54s}
  /* ---------- send sequence ---------- */
  .veil{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;transition:opacity .4s ease;
    background:radial-gradient(ellipse at center,rgba(10,10,24,.35),rgba(5,5,14,.78));backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .sending .veil{opacity:1;pointer-events:auto}
  .beam{position:fixed;inset:0;z-index:25;pointer-events:none;overflow:visible;opacity:0;transition:opacity .4s ease}
  .sending .beam{opacity:1}
  .beam path{fill:none;stroke-linecap:round}
  .beam .halo{stroke:rgba(255,140,190,.10);stroke-width:10;filter:blur(7px)}
  .beam .core{stroke:#ffd0e6;stroke-width:1.5;stroke-dasharray:2 13;filter:drop-shadow(0 0 5px rgba(255,160,210,.65));animation:dashmove 1.1s linear infinite}
  @keyframes dashmove{to{stroke-dashoffset:-15}}
  .ship{position:fixed;z-index:27;left:0;top:0;width:46px;height:46px;opacity:0;pointer-events:none;
    transform:translate(-50%,-50%);transition:opacity .3s ease}
  .sending .ship{opacity:1}
  .ship-core{position:absolute;inset:0;border-radius:15px;display:grid;place-items:center;
    background:linear-gradient(150deg,rgba(30,24,52,.9),rgba(12,10,26,.9));
    border:1px solid rgba(255,255,255,.2);
    box-shadow:0 6px 22px rgba(139,123,255,.45),0 0 0 1px rgba(255,120,170,.18),inset 0 1px 0 rgba(255,255,255,.15);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  .ship svg{width:21px;height:21px;filter:drop-shadow(0 0 8px rgba(255,110,170,.9));animation:beat 1s ease-in-out infinite}
  .ship .glow{position:absolute;inset:-7px;border-radius:20px;border:1px solid rgba(255,160,210,.35);opacity:.7}
  .tw{position:fixed;z-index:26;width:4px;height:4px;border-radius:50%;pointer-events:none;opacity:0;animation:twFade .8s ease-out forwards}
  @keyframes twFade{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(.2) translateY(-6px)}}
  .send-panel{position:fixed;z-index:45;left:50%;bottom:clamp(22px,7vh,56px);transform:translateX(-50%);
    width:min(350px,82vw);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .4s ease,visibility .4s;text-align:left}
  .sending .send-panel{opacity:1;visibility:visible}
  .sp-top{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
    font-size:12.5px;color:#c6cbff;letter-spacing:.05em;font-weight:500}
  .sp-top .sp-pct{font-variant-numeric:tabular-nums;color:#8d93b5;font-size:12px}
  .sp-track{margin-top:11px;height:5px;border-radius:99px;background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.05);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
  .sp-fill{height:100%;width:0%;border-radius:inherit;
    background:linear-gradient(90deg,#ff5f9e,#b07cff 60%,#63c8ff);
    box-shadow:0 0 14px rgba(255,120,190,.6)}
  .hold .sp-fill{animation:glowPulse 1.5s ease-in-out infinite}
  @keyframes glowPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}
  .blast{position:fixed;z-index:28;width:34px;height:34px;border-radius:50%;pointer-events:none;
    border:1px solid rgba(255,255,255,.75);box-shadow:0 0 18px rgba(255,200,230,.8);animation:blast .7s ease-out forwards}
  @keyframes blast{from{opacity:1;transform:translate(-50%,-50%) scale(.3)}to{opacity:0;transform:translate(-50%,-50%) scale(3.4)}}
  /* ---------- success ---------- */
  .success{display:none;position:fixed;inset:0;z-index:60;place-items:center;padding:20px;
    background:rgba(5,5,14,.84);backdrop-filter:blur(14px)}
  .success.show{display:grid;animation:fadein .3s ease}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .su-card{text-align:center;width:min(380px,92vw);background:#0d0c1d;border:1px solid rgba(255,255,255,.14);
    border-radius:var(--radius);padding:42px 30px 32px;position:relative;box-shadow:0 40px 90px rgba(0,0,0,.6);animation:pop .45s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes pop{from{opacity:0;transform:scale(.85) translateY(10px)}to{opacity:1;transform:none}}
  .su-heart{position:relative;width:92px;height:92px;margin:0 auto 20px;display:grid;place-items:center}
  .su-heart .ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,95,158,.5);animation:ring 2.2s ease-out infinite}
  .su-heart .ring:nth-child(2){animation-delay:.6s}
  .su-heart .ring:nth-child(3){animation-delay:1.2s}
  @keyframes ring{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.6);opacity:0}}
  .su-heart svg{width:56px;height:56px;filter:drop-shadow(0 0 18px rgba(255,95,158,.9));animation:beat 1.6s ease-in-out infinite}
  .su-card h2{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:40px;color:#fff}
  .su-card p{color:var(--mut);margin:8px 0 24px;font-size:15px;line-height:1.6}
  .su-card p b{color:var(--txt)}
  .su-btn{width:100%;padding:13px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);
    color:#fff;font:inherit;font-weight:600;cursor:pointer;transition:.2s}
  .su-btn:hover{background:rgba(255,255,255,.1)}
  .spark{position:fixed;z-index:61;pointer-events:none;animation:floatUp linear forwards}
  .spark svg{width:100%;height:100%}
  @keyframes floatUp{0%{opacity:0;transform:translateY(0) rotate(0) scale(.5)}14%{opacity:1}100%{opacity:0;transform:translateY(-44vh) rotate(150deg) scale(1.15)}}
  @media (max-width:380px){.card{padding:24px 20px 20px}}
  @media (max-width:640px){
    .planet-a{opacity:.95}
    .planet-b{opacity:.95}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
    .neb{display:none}
  }
</style>
</head>
<body>
<canvas id="space"></canvas>
<div class="neb neb-1"></div><div class="neb neb-2"></div><div class="neb neb-3"></div>

<div class="planet planet-a" id="planetA" aria-hidden="true"></div>
<div class="planet planet-b" id="planetB" aria-hidden="true"></div>

<div class="veil" aria-hidden="true"></div>

<!-- path the message travels -->
<svg class="beam" id="beam" aria-hidden="true">
  <path class="halo" id="beamHalo"/>
  <path class="core" id="beamCore"/>
</svg>
<div class="ship" id="ship" aria-hidden="true">
  <span class="glow"></span>
  <span class="ship-core">
    <svg viewBox="0 0 24 24"><defs><linearGradient id="shipG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7ab0"/><stop offset="1" stop-color="#8b7bff"/></linearGradient></defs><path fill="url(#shipG)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
  </span>
</div>

<!-- live progress -->
<div class="send-panel" id="sendPanel" aria-live="polite">
  <div class="sp-top">
    <span class="sp-txt" id="spTxt">Preparing your note…</span>
    <span class="sp-pct" id="spPct">0%</span>
  </div>
  <div class="sp-track"><div class="sp-fill" id="spFill"></div></div>
</div>

<main class="card" aria-live="polite">
  <header class="top rv d1">
    <span class="brand">Konnect <i>♥</i></span>
  </header>

  <h1 class="hello rv d2">Hey Cutie <span class="heart">♥</span></h1>
  <p class="prompt rv d3">Keshav wants to stay connected — share <b>one</b> of these:</p>

  <form id="form" class="fieldset" novalidate>
    <legend class="legend-sr">Choose a way to share your details</legend>

    <div class="rv d4">
      <label class="option" data-icon="ig" data-ph="Your Instagram @handle" data-type="text">
        <input type="radio" name="contact" value="Instagram">
        <span class="opt-icon" aria-hidden="true"></span>
        <span class="opt-copy"><b>Instagram</b><small>Drop your handle — DMs open up</small></span>
        <span class="opt-check">✓</span>
      </label>
      <label class="option" data-icon="sc" data-ph="Your Snapchat username" data-type="text">
        <input type="radio" name="contact" value="Snapchat">
        <span class="opt-icon" aria-hidden="true"></span>
        <span class="opt-copy"><b>Snapchat</b><small>Keep the streaks alive</small></span>
        <span class="opt-check">✓</span>
      </label>
      <label class="option" data-icon="ph" data-ph="Your phone number" data-type="tel">
        <input type="radio" name="contact" value="Phone Number">
        <span class="opt-icon" aria-hidden="true"></span>
        <span class="opt-copy"><b>Phone Number</b><small>For late-night talks</small></span>
        <span class="opt-check">✓</span>
      </label>
    </div>

    <div class="detail" id="detail">
      <label id="dlabel" for="contact_detail">Instagram handle</label>
      <div class="input-wrap">
        <span class="lead" id="lead"></span>
        <input type="text" id="contact_detail" autocomplete="off" placeholder="">
      </div>
      <p class="err" id="err" role="alert"></p>
    </div>

    <button class="cta rv d5" id="send" type="submit">
      <span class="spinner" aria-hidden="true"></span>
      <span class="cta-txt-ok">Send it <span aria-hidden="true">→</span></span>
    </button>
  </form>

  <p class="foot rv d5">Straight to Keshav's inbox — nothing is stored</p>
</main>

<div class="success" id="success" role="dialog" aria-modal="true" aria-labelledby="sut">
  <div class="su-card">
    <div class="su-heart">
      <span class="ring"></span><span class="ring"></span><span class="ring"></span>
      <svg viewBox="0 0 24 24" fill="#ff5f9e"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </div>
    <h2 id="sut">Message Sent ♥</h2>
    <p>Your connection has been <b>established</b>.<br>Expect a message from Keshav real soon</p>
    <button class="su-btn" id="close">Close</button>
  </div>
</div>

<script>
  emailjs.init("UUxUCWkFJBKLGkOPf");
  const SERVICE="service_lnaepwf", TEMPLATE="template_5w50wk2";
  const ICONS={
    ig:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.3"/><circle cx="17.2" cy="6.8" r="1.2" fill="currentColor" stroke="none"/></svg>',
    sc:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.2c-3.1 0-5.7 2.1-5.7 5.4 0 1.6-.5 2.4-1.3 3-.9.7-1.8.9-2.3 1.1-.2.1-.3.3-.2.5.2.7 1.6 1.1 2.6 1.3.1.4.2 1.3.3 1.9-1 .2-2.5.5-3 1.3-.2.3 0 .6.5.6 1 .1 2.7.2 3.3.5.5.3.7 1 .9 2.1.2 1 .8 1.7 2 1.7s1.8-.7 2-1.7c.2-1.1.4-1.8.9-2.1.6-.3 2.3-.4 3.3-.5.5 0 .7-.3.5-.6-.5-.8-2-1.1-3-1.3.1-.6.2-1.5.3-1.9 1-.2 2.4-.6 2.6-1.3.1-.2 0-.4-.2-.5-.5-.2-1.4-.4-2.3-1.1-.8-.6-1.3-1.4-1.3-3 0-3.3-2.6-5.4-5.7-5.4z"/></svg>',
    ph:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>'
  };
  const LEAD={"Instagram":"@","Snapchat":"","Phone Number":"+ "};
  const VALID={
    Instagram:v=>/^@?[A-Za-z0-9._]{1,30}$/.test(v),
    Snapchat:v=>/^@?[A-Za-z0-9._-]{1,30}$/.test(v),
    "Phone Number":v=>/^[+()0-9\s-]{6,20}$/.test(v)
  };
  const ERRS={
    Instagram:"That doesn't look like an Instagram handle 🙈",
    Snapchat:"Hmm, double-check that username 🙂",
    "Phone Number":"That number looks incomplete — check the digits"
  };

  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const options=[...document.querySelectorAll('.option')];
  const detail=document.getElementById('detail');
  const input=document.getElementById('contact_detail');
  const label=document.getElementById('dlabel');
  const lead=document.getElementById('lead');
  const err=document.getElementById('err');
  const btn=document.getElementById('send');
  const form=document.getElementById('form');
  const card=document.querySelector('.card');
  const panel=document.getElementById('sendPanel');
  const fill=document.getElementById('spFill');
  const pct=document.getElementById('spPct');
  const txt=document.getElementById('spTxt');
  const ship=document.getElementById('ship');
  const beam=document.getElementById('beam');
  const beamHalo=document.getElementById('beamHalo');
  const beamCore=document.getElementById('beamCore');
  const planetA=document.getElementById('planetA');
  const planetB=document.getElementById('planetB');

  options.forEach(o=>o.querySelector('.opt-icon').innerHTML=ICONS[o.dataset.icon]);
  options.forEach(o=>o.addEventListener('change',()=>{
    const sel=o.querySelector('input');
    if(!sel.checked)return;
    lead.style.display=LEAD[sel.value]===""?"none":"block";
    lead.textContent=LEAD[sel.value];
    input.type=o.dataset.type;
    input.placeholder=o.dataset.ph;
    label.textContent=o.querySelector('.opt-copy b').textContent;
    detail.classList.add('show');
    err.classList.remove('show');
    setTimeout(()=>input.focus(),120);
  }));

  function setErr(msg){
    if(!msg){err.classList.remove('show');err.textContent="";return}
    err.textContent=msg;err.classList.add('show');
    input.closest('.input-wrap').classList.remove('shake');void input.closest('.input-wrap').offsetWidth;
    input.closest('.input-wrap').classList.add('shake');
  }

  /* ---------- live send sequence ---------- */
  const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const easeOut=t=>1-Math.pow(1-t,3);
  let sendState=null, sendRaf=null;

  function beamPath(p1,p2,cx,cy){return `M ${p1.x} ${p1.y} Q ${cx} ${cy} ${p2.x} ${p2.y}`}

  function beginSend(){
    document.body.classList.add('sending');
    card.classList.add('gone');
    const a=planetA.getBoundingClientRect(), b=planetB.getBoundingClientRect();
    const p1={x:a.left+a.width/2,y:a.top+a.height/2};
    const p2={x:b.left+b.width/2,y:b.top+b.height/2};
    const cy=Math.min(p1.y,p2.y)-Math.max(80,innerHeight*.09);
    const cx=(p1.x+p2.x)/2;
    const d=beamPath(p1,p2,cx,cy);
    beam.setAttribute('viewBox',`0 0 ${innerWidth} ${innerHeight}`);
    beamHalo.setAttribute('d',d);
    beamCore.setAttribute('d',d);
    ship.style.left=p1.x+'px';ship.style.top=p1.y+'px';
    sendState={p1,p2,cx,cy,resolved:false,resAt:0,p:0,lastSpark:0,t0:performance.now()};
    txt.textContent='Preparing your note…';pct.textContent='0%';fill.style.width='0%';
    panel.classList.remove('hold');
    cancelAnimationFrame(sendRaf);
    sendRaf=requestAnimationFrame(sendLoop);
  }

  function sendLoop(t){
    const st=sendState;if(!st)return;
    if(!st.resolved){
      st.p=Math.min(.9, easeIO(Math.min(1,(t-st.t0)/2600)));
    }else{
      const from=st.p, k=easeOut(Math.max(0,Math.min(1,(t-st.resAt)/520)));
      st.p=Math.min(1,from+(1-from)*k);
    }
    /* move ship + sparks */
    const {p1,p2,cx,cy,p}=st;
    const iu=1-p;
    const x=iu*iu*p1.x+2*iu*p*cx+p*p*p2.x;
    const y=iu*iu*p1.y+2*iu*p*cy+p*p*p2.y;
    ship.style.left=x+'px';ship.style.top=y+'px';
    if(p<1&&!st.resolved&&t-st.lastSpark>110){
      st.lastSpark=t;
      const tw=document.createElement('span');tw.className='tw';
      tw.style.left=(x+8)+'px';tw.style.top=(y+6)+'px';
      tw.style.background=Math.random()>.5?'rgba(255,150,200,.9)':'rgba(180,160,255,.9)';
      tw.style.boxShadow='0 0 8px rgba(255,170,220,.8)';
      document.body.appendChild(tw);setTimeout(()=>tw.remove(),900);
    }
    /* ui */
    const perc=Math.round(p*100);
    pct.textContent=perc+'%';
    fill.style.width=perc+'%';
    if(p<.12)txt.textContent='Preparing your note…';
    else if(p<.5)txt.textContent='Travelling across the cosmos…';
    else if(p<.88)txt.textContent='Almost there…';
    if(!st.resolved&&p>=.88){txt.textContent='Waiting for delivery…';panel.classList.add('hold')}

    if(st.resolved&&st.p>=1){finishSend(st);return}
    sendRaf=requestAnimationFrame(sendLoop);
  }

  function finishSend(st){
    cancelAnimationFrame(sendRaf);sendState=null;
    txt.textContent='Delivered ♥';pct.textContent='100%';fill.style.width='100%';
    panel.classList.remove('hold');
    const b=planetB.getBoundingClientRect();
    const bx=b.left+b.width/2,by=b.top+b.height/2;
    const bl=document.createElement('span');bl.className='blast';
    bl.style.left=bx+'px';bl.style.top=by+'px';
    document.body.appendChild(bl);setTimeout(()=>bl.remove(),800);
    const sc=ship.querySelector('.ship-core');
    sc.style.transition='opacity .3s,transform .3s';
    sc.style.opacity='0';sc.style.transform='scale(1.55)';
    setTimeout(()=>showSuccess(),650);
  }

  form.addEventListener('submit',e=>{
    e.preventDefault();
    const sel=document.querySelector('input[name="contact"]:checked');
    if(!sel){setErr("Pick one of the three above first 💫");return}
    const raw=input.value.trim();
    const cleaned=raw.replace(/^@/,'');
    if(!cleaned){setErr("Now add your details in the box above 🙂");return}
    if(!VALID[sel.value](raw)){setErr(ERRS[sel.value]);return}
    setErr(false);
    btn.classList.add('loading');btn.disabled=true;btn.setAttribute('aria-busy','true');
    if(!reduced)beginSend();
    emailjs.send(SERVICE,TEMPLATE,{contact_type:sel.value,contact_detail:cleaned})
      .then(()=>{
        if(sendState){sendState.resolved=true;sendState.resAt=Math.max(performance.now(),sendState.t0+1800)}
        else showSuccess();
      })
      .catch(error=>{
        console.error('Email error:',error);
        cancelAnimationFrame(sendRaf);sendState=null;
        document.body.classList.remove('sending');
        card.classList.remove('gone');
        btn.classList.remove('loading');btn.disabled=false;btn.removeAttribute('aria-busy');
        setErr("That didn't go through — tap Send to try once more.");
      });
  });

  /* ---------- success ---------- */
  const success=document.getElementById('success');
  function showSuccess(){
    document.body.classList.remove('sending');
    panel.style.opacity='0';
    success.classList.add('show');
    sparks();
  }
  function sparks(){
    const heart='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
    const star='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.2L20.5 10l-5.2 4 1.7 6.3L12 16.7l-5 3.6L8.7 14 3.5 10l6.3-1.8z"/></svg>';
    const colors=['#ff5f9e','#8b7bff','#63c8ff','#ffffff'];
    for(let i=0;i<14;i++){
      const s=document.createElement('span');s.className='spark';
      s.innerHTML=i%2?star:heart;
      s.style.color=colors[i%colors.length];
      s.style.left=(8+Math.random()*84)+'vw';
      s.style.bottom='30%';
      const sz=10+Math.random()*16;s.style.width=sz+'px';s.style.height=sz+'px';
      s.style.animationDuration=(2.2+Math.random()*2.4)+'s';
      s.style.animationDelay=(Math.random()*.5)+'s';
      document.body.appendChild(s);setTimeout(()=>s.remove(),6000);
    }
  }
  function resetAll(){
    success.classList.remove('show');
    document.body.classList.remove('sending');
    panel.style.opacity='';
    card.classList.remove('gone');
    const sc=ship.querySelector('.ship-core');sc.style.transition='';sc.style.opacity='';sc.style.transform='';
    form.reset();detail.classList.remove('show');
    btn.classList.remove('loading');btn.disabled=false;btn.removeAttribute('aria-busy');
    setErr(false);
  }
  document.getElementById('close').addEventListener('click',resetAll);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&success.classList.contains('show'))resetAll()});

  /* ---------- starfield + shooting stars ---------- */
  const cv=document.getElementById('space'),ctx=cv.getContext('2d');
  let W,H,stars=[];
  let meteors=[],nextShoot=0,lastT=0;
  function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;
    const n=Math.min(420,Math.floor(W*H/3600));
    stars=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.25+.35,a:Math.random()*7,s:Math.random()*.02+.006}));}
  function spawnMeteor(){
    if(reduced)return;
    const fromLeft=Math.random()<.5;
    const ang=(Math.PI/180)*(20+Math.random()*20);
    const dir=fromLeft?1:-1;
    const speed=W*(0.42+Math.random()*0.3)/1000;
    meteors.push({
      x:fromLeft?-30:W+30,
      y:Math.random()*H*.45+20,
      dx:Math.cos(ang)*speed*dir,
      dy:Math.sin(ang)*speed,
      age:0,life:850+Math.random()*650,
      tail:70+Math.random()*90,
      tint:Math.random()<.8?[235,240,255]:[255,200,225]
    });
  }
  function drawMeteors(dt){
    meteors=meteors.filter(m=>{
      m.age+=dt;
      const t=m.age/m.life;
      if(t>=1)return false;
      m.x+=m.dx*dt;m.y+=m.dy*dt;
      const a=(1-t);
      const len=m.tail*(0.55+0.45*a);
      const ux=m.dx/Math.hypot(m.dx,m.dy),uy=m.dy/Math.hypot(m.dx,m.dy);
      const tx=m.x-ux*len,ty=m.y-uy*len;
      const [r,g,b]=m.tint;
      ctx.lineCap='round';
      /* outer soft glow */
      ctx.strokeStyle=`rgba(${r},${g},${b},${0.10*a})`;
      ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(m.x,m.y);ctx.stroke();
      /* core */
      const grad=ctx.createLinearGradient(tx,ty,m.x,m.y);
      grad.addColorStop(0,`rgba(${r},${g},${b},0)`);
      grad.addColorStop(1,`rgba(${r},${g},${b},${0.95*a})`);
      ctx.strokeStyle=grad;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(m.x,m.y);ctx.stroke();
      /* head glow */
      const hg=ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,11);
      hg.addColorStop(0,`rgba(255,255,255,${0.85*a})`);
      hg.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=hg;ctx.beginPath();ctx.arc(m.x,m.y,11,0,7);ctx.fill();
      return true;
    });
  }
  function draw(t){
    const dt=Math.min(50,t-lastT||16);lastT=t;
    ctx.clearRect(0,0,W,H);
    for(const st of stars){st.a+=st.s*dt*.06;
      const tw=Math.sin(st.a)*.5+.5;
      ctx.globalAlpha=.25+tw*.75;ctx.fillStyle=tw>.6?'#fff':'#cfd4ff';
      ctx.beginPath();ctx.arc(st.x,st.y,st.r,0,7);ctx.fill();
    }
    ctx.globalAlpha=1;
    if(!reduced){
      if(t>nextShoot){spawnMeteor();nextShoot=t+4500+Math.random()*6500}
      drawMeteors(dt);
      requestAnimationFrame(draw);
    }else if(meteors.length){meteors=[]}
  }
  size();addEventListener('resize',()=>{size();nextShoot=performance.now()+4000});
  if(!reduced)requestAnimationFrame(draw);else{requestAnimationFrame(()=>draw(performance.now()))}

  document.body.classList.add('ready');
</script>
</body>
